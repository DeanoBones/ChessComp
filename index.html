<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChessUp2 Challenge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      background:
        radial-gradient(circle at top, #1b1b1b 0%, #0b0b0b 60%);
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      font-size: 3.5rem;
      margin-bottom: 10px;
      color: #f7931a;
      text-shadow: 0 0 20px rgba(247,147,26,0.4);
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 50px;
      font-size: 1.1rem;
    }

    .roll-section {
      text-align: center;
      margin-bottom: 50px;
    }

    button {
      background: linear-gradient(135deg, #f7931a, #ffb347);
      border: none;
      color: black;
      padding: 18px 40px;
      font-size: 1.2rem;
      border-radius: 14px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      box-shadow:
        0 0 25px rgba(247,147,26,0.4);
    }

    button:hover {
      transform: scale(1.05);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #result-container {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #rolling-text {
      color: #666;
      letter-spacing: 3px;
      margin-bottom: 10px;
      height: 20px;
    }

    #result {
      width: 180px;
      height: 180px;
      border-radius: 24px;
      background: linear-gradient(145deg, #1f1f1f, #101010);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 5rem;
      font-weight: bold;
      color: #f7931a;
      border: 3px solid #333;
      box-shadow:
        0 0 40px rgba(247,147,26,0.15),
        inset 0 0 25px rgba(255,255,255,0.03);
      transition: 0.2s;
    }

    .rolling {
      animation: pulse 0.08s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .winner-flash {
      animation: winnerFlash 0.6s ease;
    }

    @keyframes winnerFlash {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.15); box-shadow: 0 0 50px rgba(247,147,26,0.8); }
      100% { transform: scale(1); }
    }

    .table-container {
      max-width: 1100px;
      margin: auto;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #141414;
      border-radius: 14px;
      overflow: hidden;
    }

    th, td {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #2a2a2a;
    }

    th {
      background: #1d1d1d;
      color: #f7931a;
      font-size: 1rem;
    }

    tr.available { background: #151515; }
    tr.completed { background: #102010; }

    .status { font-weight: bold; }

    .available-text { color: #f5c542; }
    .completed-text { color: #66ff99; }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #666;
      font-size: 0.9rem;
    }

    #scoreboard {
      margin-top: 40px;
      text-align: center;
      font-size: 1.2rem;
    }

    @media (max-width: 700px) {
      h1 { font-size: 2.5rem; }
      #result { width: 140px; height: 140px; font-size: 4rem; }
      button { width: 100%; }
    }
  </style>
</head>

<body>

  <h1>♟ ChessUp2 Challenge</h1>

  <div class="subtitle">
    Roll the dice to select your difficulty.
  </div>

  <div class="roll-section">

    <button id="roll-button" onclick="rollLevel()">
      🎲 ROLL RANDOM LEVEL
    </button>

    <div id="result-container">
      <div id="rolling-text"></div>
      <div id="result">?</div>
    </div>

  </div>

  <div class="table-container">

    <table>
      <thead>
        <tr>
          <th>Level</th>
          <th>Elo</th>
          <th>Prize</th>
          <th>GBP Value</th>
          <th>Status</th>
          <th>Winner</th>
        </tr>
      </thead>

      <tbody id="levels-table"></tbody>

    </table>

  </div>

  <!-- 🏆 SCOREBOARD -->
  <div id="scoreboard"></div>

  <div class="footer">
    Sponsored by Apex Champ Traders.
  </div>

<script>

const levels = [

  // 400 ELO (1–6)
  { level: 1, elo: 400, reward: 2000, winner: "Bucky" },
  { level: 2, elo: 400, reward: 2000, winner: null },
  { level: 3, elo: 400, reward: 2000, winner: null },
  { level: 4, elo: 400, reward: 2000, winner: null },
  { level: 5, elo: 400, reward: 2000, winner: null },
  { level: 6, elo: 400, reward: 2000, winner: "Bucky" },

  // 500 ELO...
  { level: 7, elo: 500, reward: 3000, winner: null },
  { level: 8, elo: 500, reward: 3000, winner: "Shandalf" },
  { level: 9, elo: 500, reward: 3000, winner: "Bucky" },
  { level: 10, elo: 500, reward: 3000, winner: null },
  { level: 11, elo: 500, reward: 3000, winner: null },

  // 600–1500 (unchanged)
  { level: 12, elo: 600, reward: 6000, winner: "Shandalf" },
  { level: 13, elo: 600, reward: 4000, winner: null },
  { level: 14, elo: 600, reward: 4000, winner: "Bucky" },
  { level: 15, elo: 600, reward: 4000, winner: null },
  { level: 16, elo: 600, reward: 4000, winner: null },

  { level: 17, elo: 700, reward: 8000, winner: "Shandalf" },
  { level: 18, elo: 700, reward: 5000, winner: null },
  { level: 19, elo: 700, reward: 5000, winner: null },
  { level: 20, elo: 700, reward: 5000, winner: null },

  { level: 21, elo: 800, reward: 10000, winner: "Bucky" },
  { level: 22, elo: 800, reward: 6000, winner: null },
  { level: 23, elo: 800, reward: 6000, winner: null },
  { level: 24, elo: 800, reward: 6000, winner: null },

  { level: 25, elo: 900, reward: 12000, winner: "Bucky" },
  { level: 26, elo: 900, reward: 8000, winner: null },
  { level: 27, elo: 900, reward: 8000, winner: null },
  { level: 28, elo: 900, reward: 8000, winner: null },

  { level: 29, elo: 1000, reward: 14000, winner: "Shandalf" },
  { level: 30, elo: 1000, reward: 10000, winner: null },
  { level: 31, elo: 1000, reward: 10000, winner: "Rink" },
  { level: 32, elo: 1000, reward: 10000, winner: null },

  { level: 33, elo: 1100, reward: 12000, winner: null },
  { level: 34, elo: 1100, reward: 12000, winner: "Bucky" },
  { level: 35, elo: 1100, reward: 12000, winner: null },
  { level: 36, elo: 1100, reward: 12000, winner: null },

  { level: 37, elo: 1200, reward: 18000, winner: "Bucky" },
  { level: 38, elo: 1200, reward: 15000, winner: null },
  { level: 39, elo: 1200, reward: 15000, winner: "Bucky" },

  { level: 40, elo: 1300, reward: 20000, winner: null },
  { level: 41, elo: 1400, reward: 35000, winner: null },
  { level: 42, elo: 1500, reward: 50000, winner: null }

];

let btcPriceGBP = 0;

async function fetchBitcoinPrice() {
  try {
    const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=gbp');
    const data = await res.json();
    btcPriceGBP = data.bitcoin.gbp;
    renderTable();
    renderScores();
  } catch (e) {
    console.error(e);
  }
}

function satsToGBP(sats) {
  if (!btcPriceGBP) return "...";
  const btc = sats / 100000000;
  return "£" + (btc * btcPriceGBP).toFixed(2);
}

function renderTable() {
  const table = document.getElementById("levels-table");
  table.innerHTML = "";

  levels.forEach(item => {
    const row = document.createElement("tr");
    const completed = item.winner !== null;

    row.className = completed ? "completed" : "available";

    row.innerHTML = `
      <td>${item.level}</td>
      <td>${item.elo}</td>
      <td>${item.reward.toLocaleString()} SATS</td>
      <td>${satsToGBP(item.reward)}</td>
      <td class="status">
        <span class="${completed ? 'completed-text' : 'available-text'}">
          ${completed ? 'COMPLETED' : 'AVAILABLE'}
        </span>
      </td>
      <td>${item.winner || '-'}</td>
    `;

    table.appendChild(row);
  });
}

// 🏆 SCOREBOARD
function renderScores() {

  const players = {
    Bucky: 0,
    Shandalf: 0,
    Rink: 0
  };

  levels.forEach(l => {
    if (l.winner && players.hasOwnProperty(l.winner)) {
      players[l.winner] += l.reward;
    }
  });

  document.getElementById("scoreboard").innerHTML = `
    <h2 style="color:#f7931a; text-align:center; margin-top:40px;">
      🏆 Total Sats Won
    </h2>

    <div style="text-align:center; font-size:1.1rem; margin-top:10px;">

      <p>
        🔥 Bucky: <b>${players.Bucky.toLocaleString()} SATS</b>
        <br>
        💷 ${satsToGBP(players.Bucky)}
      </p>

      <p>
        ⚔️ Shandalf: <b>${players.Shandalf.toLocaleString()} SATS</b>
        <br>
        💷 ${satsToGBP(players.Shandalf)}
      </p>

      <p>
        🧠 Rink: <b>${players.Rink.toLocaleString()} SATS</b>
        <br>
        💷 ${satsToGBP(players.Rink)}
      </p>

    </div>
  `;
}

async function rollLevel() {
  const button = document.getElementById("roll-button");
  const result = document.getElementById("result");
  const rollingText = document.getElementById("rolling-text");

  const availableLevels = levels.filter(l => l.winner === null);

  if (!availableLevels.length) return;

  button.disabled = true;
  result.classList.add("rolling");

  const interval = setInterval(() => {
    result.textContent = Math.floor(Math.random() * 42) + 1;
  }, 80);

  await new Promise(r => setTimeout(r, 2500));

  clearInterval(interval);

  const chosen = availableLevels[Math.floor(Math.random() * availableLevels.length)];

  result.classList.remove("rolling");
  result.textContent = chosen.level;

  rollingText.textContent =
    `🏆 Elo ${chosen.elo} • ${chosen.reward.toLocaleString()} SATS`;

  result.classList.add("winner-flash");

  setTimeout(() => result.classList.remove("winner-flash"), 700);

  button.disabled = false;
}

fetchBitcoinPrice();
renderTable();
renderScores();

</script>

</body>
</html>
